services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8124:8123"
      - "9002:9000"
    environment:
      - CLICKHOUSE_USER=click
      - CLICKHOUSE_PASSWORD=click
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.9.1
    restart: always
    depends_on:
      - postgres
      - clickhouse
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - APIFY_TOKEN=${APIFY_TOKEN}
      - _PIP_ADDITIONAL_REQUIREMENTS=apify-client python-dotenv clickhouse-driver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scrapers:/opt/airflow/scrapers
      - ./normalizers:/opt/airflow/normalizers
      - ./raw_data:/opt/airflow/raw_data
      - airflow_data:/opt/airflow
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com &&
               airflow webserver & airflow scheduler"

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    depends_on:
      - clickhouse

volumes:
  clickhouse_data:
  postgres_data:
  airflow_data:
